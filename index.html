<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PocketBench Pro - Minecraft BE 3Dモデラー</title>
<style>
  :root {
    --bg-dark: #1e2229;
    --bg-panel: #282c34;
    --bg-input: #181a1f;
    --accent: #3e8ed0;
    --success: #48c78e;
    --danger: #f14668;
    --text-main: #abb2bf;
    --text-light: #ffffff;
    --border: #3b4048;
  }
  * {
    box-sizing: border-box;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-dark); color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    height: 46px; background-color: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; color: var(--text-light); margin: 0; }
  .header-btns { display: flex; gap: 6px; }
  .btn {
    background-color: var(--accent); color: white; border: none;
    border-radius: 6px; padding: 6px 10px; font-size: 12px;
    font-weight: bold; cursor: pointer;
  }
  .btn:active { opacity: 0.8; }
  .btn-success { background-color: var(--success); color: #111; }
  .btn-danger { background-color: var(--danger); }
  .btn-dark { background-color: var(--bg-input); border: 1px solid var(--border); color: var(--text-light); }
  .btn-dark.active { background-color: var(--accent); border-color: var(--accent); }
  .btn-small { padding: 4px 7px; font-size: 11px; }

  #viewport {
    flex: 1; position: relative; width: 100%; min-height: 36%;
    background: radial-gradient(circle, #2c313c 0%, #181a1f 100%);
  }
  #viewport canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
  .viewport-hint {
    position: absolute; bottom: 6px; left: 8px; font-size: 10px;
    background: rgba(0, 0, 0, 0.55); padding: 3px 7px; border-radius: 4px; pointer-events: none;
  }
  #controls {
    height: 57%; background-color: var(--bg-panel);
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--border); background-color: var(--bg-input); }
  .tab {
    flex: 1; padding: 9px 0; text-align: center; font-size: 12px;
    font-weight: bold; color: var(--text-main); border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text-light); border-bottom-color: var(--accent); background-color: var(--bg-panel); }
  .tab-content { flex: 1; overflow-y: auto; padding: 10px; display: none; }
  .tab-content.active { display: block; }
  .outliner-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cube-list { list-style: none; padding: 0; margin: 0; }
  .cube-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; background-color: var(--bg-input);
    border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; font-size: 13px;
  }
  .cube-item.selected { border-color: var(--accent); background-color: rgba(62, 142, 208, 0.18); color: var(--text-light); }
  .cube-actions { display: flex; gap: 4px; }

  .step-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-input); padding: 6px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px;
  }
  .step-btns { display: flex; gap: 4px; }

  .control-group { margin-bottom: 10px; background: var(--bg-input); padding: 8px 10px; border-radius: 8px; }
  .control-group h3 { margin: 0 0 6px 0; font-size: 12px; color: var(--text-light); }
  .axis-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .axis-row:last-child { margin-bottom: 0; }
  .axis-label { width: 16px; font-weight: bold; font-size: 12px; text-align: center; }
  .axis-x { color: #e06c75; } .axis-y { color: #98c379; } .axis-z { color: #61afef; }
  input[type="range"] { flex: 1; height: 22px; accent-color: var(--accent); }
  input[type="number"] {
    width: 58px; background: var(--bg-panel); border: 1px solid var(--border);
    color: var(--text-light); padding: 4px; border-radius: 4px; text-align: center; font-size: 12px;
  }

  .paint-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
  .face-selector { display: flex; gap: 4px; margin-bottom: 6px; }
  .face-btn {
    flex: 1; padding: 5px 2px; font-size: 11px; background: var(--bg-input);
    color: var(--text-main); border: 1px solid var(--border); border-radius: 4px; text-align: center;
  }
  .face-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold; }
  .paint-canvas-wrap {
    display: flex; justify-content: center; align-items: center;
    background: #121417; padding: 6px; border-radius: 8px; border: 1px solid var(--border);
  }
  #paint-canvas {
    background-image: linear-gradient(45deg, #2a2e37 25%, transparent 25%),
                      linear-gradient(-45deg, #2a2e37 25%, transparent 25%),
                      linear-gradient(45deg, transparent 75%, #2a2e37 75%),
                      linear-gradient(-45deg, transparent 75%, #2a2e37 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    border: 1px solid #666; touch-action: none; image-rendering: pixelated;
  }

  .form-row { margin-bottom: 10px; }
  .form-row label { display: block; font-size: 12px; margin-bottom: 4px; }
  .form-row input[type="text"], .form-row input[type="color"] {
    width: 100%; padding: 7px; background: var(--bg-input);
    border: 1px solid var(--border); color: var(--text-light); border-radius: 6px; font-size: 13px;
  }
  .form-row input[type="color"] { height: 38px; padding: 2px; }
</style>
</head>
<body>

<header>
  <h1>🧊 PocketBench Pro</h1>
  <div class="header-btns">
    <button class="btn btn-success" onclick="exportTexturePNG()">PNG出力</button>
    <button class="btn" onclick="exportBedrockJSON()">JSON出力</button>
  </div>
</header>

<div id="viewport">
  <div class="viewport-hint">1本指: 回転 / 2本指: ズーム・移動</div>
</div>

<div id="controls">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('outliner', this)">パーツ</div>
    <div class="tab" onclick="switchTab('transform', this)">変形・位置</div>
    <div class="tab" onclick="switchTab('paint', this)">ペイント</div>
    <div class="tab" onclick="switchTab('settings', this)">設定</div>
  </div>

  <!-- タブ1: ボーン＆パーツ一覧 -->
  <div id="tab-outliner" class="tab-content active">
    <div class="outliner-header">
      <span style="font-size:12px;">🦴 ボーン＆パーツ構成</span>
      <div style="display:flex; gap:4px;">
        <button class="btn btn-success btn-small" onclick="loadPlayerTemplate()">🧍4D素体</button>
        <button class="btn btn-dark btn-small" onclick="addBone()">＋ボーン</button>
        <button class="btn btn-small" onclick="addCube()">＋キューブ</button>
      </div>

    </div>
    <div id="outliner-tree"></div>
  </div>
  <!-- タブ2: 変形・位置 -->
  <div id="tab-transform" class="tab-content">
    <div id="no-selection-msg" style="text-align:center; padding:20px; font-size:13px;">
      パーツ一覧からキューブを選択してください
    </div>
    <div id="transform-controls" style="display:none;">
      <div class="step-bar">
        <span>スライダー刻み幅:</span>
        <div class="step-btns">
          <button class="btn btn-dark btn-small step-btn active" onclick="setStep(1, this)">1</button>
          <button class="btn btn-dark btn-small step-btn" onclick="setStep(0.5, this)">0.5</button>
          <button class="btn btn-dark btn-small step-btn" onclick="setStep(0.1, this)">0.1</button>
        </div>
      </div>

      <div class="control-group">
        <h3>サイズ (Size)</h3>
        <div class="axis-row">
          <span class="axis-label axis-x">X</span>
          <input type="range" id="size-x-range" min="0" max="32" step="1" oninput="updateTransform('size', 'x', this.value)">
          <input type="number" id="size-x-num" min="0.1" max="64" step="any" onchange="updateTransform('size', 'x', this.value)">
        </div>
        <div class="axis-row">
          <span class="axis-label axis-y">Y</span>
          <input type="range" id="size-y-range" min="0" max="32" step="1" oninput="updateTransform('size', 'y', this.value)">
          <input type="number" id="size-y-num" min="0.1" max="64" step="any" onchange="updateTransform('size', 'y', this.value)">
        </div>
        <div class="axis-row">
          <span class="axis-label axis-z">Z</span>
          <input type="range" id="size-z-range" min="0" max="32" step="1" oninput="updateTransform('size', 'z', this.value)">
          <input type="number" id="size-z-num" min="0.1" max="64" step="any" onchange="updateTransform('size', 'z', this.value)">
        </div>
      </div>

      <div class="control-group">
        <h3>位置 (Position / Origin)</h3>
        <div class="axis-row">
          <span class="axis-label axis-x">X</span>
          <input type="range" id="pos-x-range" min="-32" max="32" step="1" oninput="updateTransform('pos', 'x', this.value)">
          <input type="number" id="pos-x-num" step="any" onchange="updateTransform('pos', 'x', this.value)">
        </div>
        <div class="axis-row">
          <span class="axis-label axis-y">Y</span>
          <input type="range" id="pos-y-range" min="-16" max="48" step="1" oninput="updateTransform('pos', 'y', this.value)">
          <input type="number" id="pos-y-num" step="any" onchange="updateTransform('pos', 'y', this.value)">
        </div>
        <div class="axis-row">
          <span class="axis-label axis-z">Z</span>
          <input type="range" id="pos-z-range" min="-32" max="32" step="1" oninput="updateTransform('pos', 'z', this.value)">
          <input type="number" id="pos-z-num" step="any" onchange="updateTransform('pos', 'z', this.value)">
        </div>
      </div>

      <div class="control-group">
        <h3>回転 (Rotation)</h3>
        <div class="axis-row">
          <span class="axis-label axis-x">X</span>
          <input type="range" id="rot-x-range" min="-180" max="180" step="1" oninput="updateTransform('rot', 'x', this.value)">
          <input type="number" id="rot-x-num" step="any" onchange="updateTransform('rot', 'x', this.value)">
        </div>
        <div class="axis-row">
          <span class="axis-label axis-y">Y</span>
          <input type="range" id="rot-y-range" min="-180" max="180" step="1" oninput="updateTransform('rot', 'y', this.value)">
          <input type="number" id="rot-y-num" step="any" onchange="updateTransform('rot', 'y', this.value)">
        </div>
        <div class="axis-row">
          <span class="axis-label axis-z">Z</span>
          <input type="range" id="rot-z-range" min="-180" max="180" step="1" oninput="updateTransform('rot', 'z', this.value)">
          <input type="number" id="rot-z-num" step="any" onchange="updateTransform('rot', 'z', this.value)">
        </div>
      </div>
    </div>
  </div>

  <!-- タブ3: 高機能ペイント -->
  <div id="tab-paint" class="tab-content">
    <div id="no-paint-msg" style="text-align:center; padding:20px; font-size:13px;">
      パーツ一覧からキューブを選択してください
    </div>
    <div id="paint-controls" style="display:none;">
      <div class="face-selector">
        <div class="face-btn active" onclick="selectPaintFace(4, this)">上</div>
        <div class="face-btn" onclick="selectPaintFace(5, this)">下</div>
        <div class="face-btn" onclick="selectPaintFace(0, this)">北</div>
        <div class="face-btn" onclick="selectPaintFace(1, this)">南</div>
        <div class="face-btn" onclick="selectPaintFace(2, this)">東</div>
        <div class="face-btn" onclick="selectPaintFace(3, this)">西</div>
      </div>

      <div class="paint-toolbar" style="background:var(--bg-input); padding:6px; border-radius:6px;">
        <div style="display:flex; align-items:center; gap:4px; font-size:11px;">
          <span>解像度:</span>
          <select id="tex-res-select" onchange="changeTexResolution(this.value)" style="background:var(--bg-panel); color:#fff; border:1px solid var(--border); border-radius:4px; padding:3px;">
            <option value="8">8×8</option>
            <option value="16" selected>16×16 (標準)</option>
            <option value="32">32×32 (高精細)</option>
            <option value="64">64×64 (HD)</option>
          </select>
        </div>
        <label class="btn btn-dark btn-small" style="margin:0; cursor:pointer;">
          📂 画像読込
          <input type="file" accept="image/*" style="display:none;" onchange="loadImageToFace(this)">
        </label>
      </div>

      <div class="paint-toolbar" style="gap:3px;">
        <button class="btn btn-dark btn-small active" id="tool-pen" onclick="setPaintTool('pen')">✏ペン</button>
        <button class="btn btn-dark btn-small" id="tool-fill" onclick="setPaintTool('fill')">🪣塗り</button>
        <button class="btn btn-dark btn-small" id="tool-line" onclick="setPaintTool('line')">📏線</button>
        <button class="btn btn-dark btn-small" id="tool-circle" onclick="setPaintTool('circle')">⭕円</button>
        <button class="btn btn-dark btn-small" id="tool-eyedrop" onclick="setPaintTool('eyedrop')">💧スポイト</button>
        <button class="btn btn-dark btn-small" id="tool-eraser" onclick="setPaintTool('eraser')">🧹消す</button>
        <button class="btn btn-danger btn-small" onclick="clearCurrentFace()">🗑全消</button>
      </div>

      <div class="paint-toolbar" style="background:var(--bg-input); padding:5px 8px; border-radius:6px;">
        <div style="display:flex; align-items:center; gap:6px; font-size:11px;">
          <span>色:</span>
          <input type="color" id="brush-color" value="#ff5555" style="width:32px; height:24px; border:none; background:none; padding:0;">
        </div>
        <div style="display:flex; align-items:center; gap:6px; font-size:11px; flex:1; max-width:160px;">
          <span>太さ:<b id="brush-size-label">1</b>px</span>
          <input type="range" id="brush-size" min="1" max="4" step="1" value="1" oninput="document.getElementById('brush-size-label').textContent=this.value">
        </div>
      </div>

      <div class="paint-canvas-wrap">
        <canvas id="paint-canvas" width="224" height="224"></canvas>
      </div>
    </div>
  </div>

    <!-- タブ4: 設定（ボーン支点・パーツ名・色） -->
  <div id="tab-settings" class="tab-content">
    <div class="control-group">
      <h3>💾 Web内保存（最大10個まで）</h3>
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        <input type="text" id="slot-save-name" placeholder="保存名（例：剣、4Dキャラ）" style="flex:1; padding:6px; background:var(--bg-panel); border:1px solid var(--border); color:#fff; border-radius:6px; font-size:12px;">
        <button class="btn btn-success btn-small" onclick="saveToWebSlot()">＋ 新規保存</button>
      </div>
      <div id="web-slot-list" style="margin-bottom:8px;"></div>

      <h3 style="margin-top:8px; border-top:1px solid var(--border); padding-top:8px;">📁 外部ファイル出力・読込</h3>
      <div style="display:flex; gap:6px; margin-bottom:6px;">
        <button class="btn btn-dark btn-small" style="flex:1;" onclick="saveProjectFile()">📥 .pbench出力</button>
        <label class="btn btn-dark btn-small" style="flex:1; text-align:center; margin:0; cursor:pointer;">
          📂 .pbench読込
          <input type="file" accept=".pbench,.json" style="display:none;" onchange="loadProjectFile(this)">
        </label>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#888;">
        <span id="autosave-status">自動バックアップ: 待機中</span>
        <button class="btn btn-danger btn-small" onclick="resetAutoSave()">作業リセット</button>
      </div>
    </div>

    <div class="form-row">
      <label>モデル識別子 (Identifier)</label>
      <input type="text" id="model-id" value="geometry.custom_model" oninput="triggerAutoSave()">
    </div>

    <div class="control-group" id="bone-settings-box">
      <h3>🦴 選択中ボーン設定（階層・関節の支点）</h3>
      <div class="form-row">
        <label>親ボーン (Parent) ※階層化</label>
        <select id="bone-parent-select" onchange="setBoneParent(this.value)" style="width:100%; padding:7px; background:var(--bg-input); border:1px solid var(--border); color:#fff; border-radius:6px; font-size:13px;"></select>
      </div>
      <div class="form-row">
        <label>ボーン名 (例: head, body, leftArm)</label>
        <input type="text" id="bone-name-input" onchange="renameSelectedBone(this.value)">
      </div>
      <div class="axis-row">
        <span class="axis-label axis-x">X</span>
        <input type="number" id="bone-piv-x" step="any" style="flex:1;" onchange="updateBonePivot('x', this.value)">
        <span class="axis-label axis-y">Y</span>
        <input type="number" id="bone-piv-y" step="any" style="flex:1;" onchange="updateBonePivot('y', this.value)">
        <span class="axis-label axis-z">Z</span>
        <input type="number" id="bone-piv-z" step="any" style="flex:1;" onchange="updateBonePivot('z', this.value)">
      </div>
    </div>


    <div id="cube-settings-box" style="display:none;">
      <div class="form-row">
        <label>選択中キューブの所属ボーン</label>
        <select id="cube-bone-select" onchange="moveCubeToBone(this.value)" style="width:100%; padding:7px; background:var(--bg-input); border:1px solid var(--border); color:#fff; border-radius:6px; font-size:13px;"></select>
      </div>
      <div class="form-row">
        <label>選択中キューブの名前</label>
        <input type="text" id="cube-name-input" placeholder="パーツ名" onchange="renameSelectedCube(this.value)">
      </div>
      <div class="form-row">
        <label>選択中キューブの基本色</label>
        <input type="color" id="cube-color" value="#4fa3e3" onchange="updateCubeColor(this.value)">
      </div>
    </div>
  </div>
</div>
<script>
  // --- 3Dビューポート & タッチ操作 ---
  const viewport = document.getElementById('viewport');
  const canvas = document.createElement('canvas');
  viewport.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  let camYaw = -0.6;
  let camPitch = 0.45;
  let camZoom = 14;
  let camPanX = 0;
  let camPanY = 0;

  let isDragging = false;
  let lastTouchX = 0;
  let lastTouchY = 0;
  let lastPinchDist = 0;

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
      isDragging = true;
      lastTouchX = e.touches.item(0).clientX;
      lastTouchY = e.touches.item(0).clientY;
    } else if (e.touches.length === 2) {
      isDragging = false;
      const dx = e.touches.item(0).clientX - e.touches.item(1).clientX;
      const dy = e.touches.item(0).clientY - e.touches.item(1).clientY;
      lastPinchDist = Math.hypot(dx, dy);
      lastTouchX = (e.touches.item(0).clientX + e.touches.item(1).clientX) / 2;
      lastTouchY = (e.touches.item(0).clientY + e.touches.item(1).clientY) / 2;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      const dx = e.touches.item(0).clientX - lastTouchX;
      const dy = e.touches.item(0).clientY - lastTouchY;
      camYaw += dx * 0.01;
      camPitch = Math.max(-1.4, Math.min(1.4, camPitch + dy * 0.01));
      lastTouchX = e.touches.item(0).clientX;
      lastTouchY = e.touches.item(0).clientY;
    } else if (e.touches.length === 2) {
      const dx = e.touches.item(0).clientX - e.touches.item(1).clientX;
      const dy = e.touches.item(0).clientY - e.touches.item(1).clientY;
      const dist = Math.hypot(dx, dy);
      if (lastPinchDist > 0) {
        camZoom = Math.max(3, Math.min(50, camZoom * (dist / lastPinchDist)));
      }
      lastPinchDist = dist;

      const midX = (e.touches.item(0).clientX + e.touches.item(1).clientX) / 2;
      const midY = (e.touches.item(0).clientY + e.touches.item(1).clientY) / 2;
      camPanX += midX - lastTouchX;
      camPanY += midY - lastTouchY;
      lastTouchX = midX;
      lastTouchY = midY;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    isDragging = false;
    lastPinchDist = 0;
  });

  function project(x, y, z) {
    const cosY = Math.cos(camYaw);
    const sinY = Math.sin(camYaw);
    const x1 = x * cosY - z * sinY;
    const z1 = x * sinY + z * cosY;

    const cosP = Math.cos(camPitch);
    const sinP = Math.sin(camPitch);
    const y2 = y * cosP - z1 * sinP;
    const z2 = y * sinP + z1 * cosP;

    const fov = 400;
    const dist = 60;
    const scale = (fov / (dist + z2)) * (camZoom / 10);

    return {
      x: canvas.width / 2 + camPanX + x1 * scale,
      y: canvas.height / 2 + camPanY - y2 * scale,
      z: z2
    };
  }

  function rotatePoint(px, py, pz, rx, ry, rz) {
    const rad = Math.PI / 180;
    const ax = rx * rad, ay = ry * rad, az = rz * rad;

    let y1 = py * Math.cos(ax) - pz * Math.sin(ax);
    let z1 = py * Math.sin(ax) + pz * Math.cos(ax);
    py = y1; pz = z1;

    let x2 = px * Math.cos(ay) + pz * Math.sin(ay);
    let z2 = -px * Math.sin(ay) + pz * Math.cos(ay);
    px = x2; pz = z2;

    let x3 = px * Math.cos(az) - py * Math.sin(az);
    let y3 = px * Math.sin(az) + py * Math.cos(az);
    return { x: x3, y: y3, z: pz };
  }

  function shadeColor(hex, factor) {
    if (!hex || !hex.startsWith('#')) return hex;
    const num = parseInt(hex.replace('#', ''), 16);
    const r = Math.min(255, Math.max(0, Math.round(((num >> 16) & 255) * factor)));
    const g = Math.min(255, Math.max(0, Math.round(((num >> 8) & 255) * factor)));
    const b = Math.min(255, Math.max(0, Math.round((num & 255) * factor)));
    return `rgb(${r},${g},${b})`;
  }
  // --- ボーン＆キューブ データ管理 ---
  let bones = new Array();
  let cubes = new Array();
  let selectedBoneId = null;
  let selectedId = null;
  let boneCounter = 1;
  let cubeCounter = 1;
  let currentStep = 1;
  let selectedFace = 4;
  let paintTool = 'pen';
  let texRes = 16;

  function createEmptyTextures(res) {
    const faces = new Array();
    const total = res * res;
    for (let f = 0; f < 6; f++) {
      const grid = new Array();
      for (let i = 0; i < total; i++) grid.push(null);
      faces.push(grid);
    }
    return faces;
  }

  function updateBonePivot(axis, val) {

  function deleteBone(id, event) {
    event.stopPropagation();

    const idx = bones.findIndex(x => x.id === id);

  }
  function isDescendantBone(targetId, ancestorId) {
    let curr = bones.find(b => b.id === targetId);
    while (curr && curr.parentId) {
      if (curr.parentId === ancestorId) return true;
      curr = bones.find(b => b.id === curr.parentId);

    return false;
  }

  function addCube() {

  function duplicateCube(id, event) {

  function moveCubeToBone(newBoneId) {

  function promptRenameCube(id, event) {

  function renameSelectedCube(newName) {

  function deleteCube(id, event) {

  function setStep(stepVal, el) {

    document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));

    const axes = new Array('x', 'y', 'z');

  }

  function updateTransform(type, axis, val) {
    const cube = cubes.find(c => c.id === selectedId);
    if (!cube) return;
    val = parseFloat(val);
    if (isNaN(val)) val = 0;

    // 現在の刻み幅（1 / 0.5 / 0.1）に合わせて端数ズレを自動補正
    val = Math.round(val / currentStep) * currentStep;

    if (type === 'size' && val < 0.05) {
      val = (currentStep >= 0.5) ? currentStep : 0.1;
    }
    cube[type][axis] = Math.round(val * 100) / 100;
    updateUIInputs();
    renderOutliner();
  }


  function updateCubeColor(hex) {
    const cube = cubes.find(c => c.id === selectedId);

  }

  function updateUIInputs() {
    const bone = bones.find(b => b.id === selectedBoneId);
    if (bone) {
      document.getElementById('bone-name-input').value = bone.name;

      bones.forEach(cand => {
        if (cand.id === bone.id || isDescendantBone(cand.id, bone.id)) return;
        const opt = document.createElement('option');
        opt.value = cand.id;
        opt.textContent = cand.name;
        if (bone.parentId === cand.id) opt.selected = true;

    const cube = cubes.find(c => c.id === selectedId);

    const bSel = document.getElementById('cube-bone-select');
    bSel.innerHTML = '';
    bones.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.name;
      if (b.id === cube.boneId) opt.selected = true;
      bSel.appendChild(opt);
    });

    document.getElementById('cube-color').value = cube.color;
    document.getElementById('cube-name-input').value = cube.name;
  }

   function renderOutliner() {
    const tree = document.getElementById('outliner-tree');
    if (!tree) return;
    tree.innerHTML = '';

    function renderBoneNode(b, depth) {
      const isBoneSel = (b.id === selectedBoneId);
      const boneDiv = document.createElement('div');
      boneDiv.style.cssText = `margin-left:${depth * 14}px; background:var(--bg-input); border:1px solid ${isBoneSel ? '#f06292' : 'var(--border)'}; border-radius:6px; margin-bottom:6px; overflow:hidden;`;

      const header = document.createElement('div');
      header.style.cssText = `display:flex; justify-content:space-between; align-items:center; padding:7px 10px; background:${isBoneSel ? 'rgba(240,98,146,0.18)' : 'rgba(255,255,255,0.04)'}; font-size:13px; font-weight:bold; color:#fff;`;
      header.onclick = (e) => selectBone(b.id, e);
      header.innerHTML = `
        <span style="display:flex; align-items:center; gap:5px;">
          <span onclick="toggleBoneCollapse('${b.id}', event)" style="cursor:pointer; padding:0 4px;">${b.collapsed ? '▶' : '▼'}</span>
          ${depth > 0 ? '↳ ' : ''}🦴 ${b.name}
        </span>
        <div class="cube-actions">
          <button class="btn btn-dark btn-small" onclick="promptRenameBone('${b.id}', event)">名前</button>
          <button class="btn btn-danger btn-small" onclick="deleteBone('${b.id}', event)">削除</button>
        </div>
      `;
      boneDiv.appendChild(header);

      if (!b.collapsed) {
        const ul = document.createElement('ul');
        ul.className = 'cube-list';
        ul.style.padding = '6px 6px 2px 14px';

        const childCubes = cubes.filter(c => c.boneId === b.id);
        childCubes.forEach(c => {
          const li = document.createElement('li');
          li.className = 'cube-item' + (c.id === selectedId ? ' selected' : '');
          li.onclick = () => selectCube(c.id);
          li.innerHTML = `
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:45%;">📦 ${c.name}</span>
            <div class="cube-actions">
              <button class="btn btn-dark btn-small" onclick="promptRenameCube('${c.id}', event)">名前</button>
              <button class="btn btn-small" onclick="duplicateCube('${c.id}', event)">複製</button>
              <button class="btn btn-danger btn-small" onclick="deleteCube('${c.id}', event)">削除</button>
            </div>
          `;
          ul.appendChild(li);
        });
        boneDiv.appendChild(ul);
        tree.appendChild(boneDiv);

        bones.filter(child => child.parentId === b.id).forEach(child => {
          renderBoneNode(child, depth + 1);
        });
      } else {
        tree.appendChild(boneDiv);
      }
    }

    bones.filter(b => !b.parentId).forEach(rootBone => renderBoneNode(rootBone, 0));
  }


  function switchTab(tabName, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tab-' + tabName).classList.add('active');
    if (tabName === 'paint') renderPaintCanvas();
  }
  // --- 高機能ペイント & 誤爆防止長押しスポイト ---
  const pCanvas = document.getElementById('paint-canvas');
  const pCtx = pCanvas.getContext('2d');
  let isPainting = false;
  let startCell = null;
  let currentCell = null;
  let longPressTimer = null;
  let isLongPressEyedrop = false;
  let previewBackup = null;

  function selectPaintFace(faceIdx, el) {
    selectedFace = faceIdx;
    document.querySelectorAll('.face-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderPaintCanvas();
  }

  function setPaintTool(tool) {
    paintTool = tool;
    const tools = new Array('pen', 'fill', 'line', 'circle', 'eyedrop', 'eraser');
    tools.forEach(t => {
      const btn = document.getElementById('tool-' + t);
      if (btn) btn.classList.toggle('active', t === tool);
    });
  }

  function changeTexResolution(newResStr) {
    const newRes = parseInt(newResStr);
    const cube = cubes.find(c => c.id === selectedId);
    if (!cube || cube.res === newRes) return;
    const oldRes = cube.res;
    const newTextures = new Array();
    for (let f = 0; f < 6; f++) {
      const oldGrid = cube.textures.at(f);
      const newGrid = new Array();
      for (let y = 0; y < newRes; y++) {
        for (let x = 0; x < newRes; x++) {
          const ox = Math.floor((x / newRes) * oldRes);
          const oy = Math.floor((y / newRes) * oldRes);
          newGrid.push(oldGrid.at(oy * oldRes + ox));
        }
      }
      newTextures.push(newGrid);
    }
    cube.res = newRes;
    cube.textures = newTextures;
    texRes = newRes;
    renderPaintCanvas();
  }

  function clearCurrentFace() {
    const cube = cubes.find(c => c.id === selectedId);
    if (!cube) return;
    const total = cube.res * cube.res;
    for (let i = 0; i < total; i++) {
      cube.textures.at(selectedFace).splice(i, 1, null);
    }
    renderPaintCanvas();
  }

  function loadImageToFace(input) {
    const file = input.files.item(0);
    const cube = cubes.find(c => c.id === selectedId);
    if (!file || !cube) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const res = cube.res;
        const off = document.createElement('canvas');
        off.width = res; off.height = res;
        const oCtx = off.getContext('2d');
        oCtx.imageSmoothingEnabled = false;
        oCtx.drawImage(img, 0, 0, res, res);
        const imgData = oCtx.getImageData(0, 0, res, res).data;
        const grid = cube.textures.at(selectedFace);
        for (let i = 0; i < res * res; i++) {
          const a = imgData[i * 4 + 3];
          if (a < 128) {
            grid.splice(i, 1, null);
          } else {
            const r = imgData[i * 4].toString(16).padStart(2, '0');
            const g = imgData[i * 4 + 1].toString(16).padStart(2, '0');
            const b = imgData[i * 4 + 2].toString(16).padStart(2, '0');
            grid.splice(i, 1, '#' + r + g + b);
          }
        }
        renderPaintCanvas();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    input.value = '';
  }

  function getCellFromTouch(e) {
    const cube = cubes.find(c => c.id === selectedId);
    if (!cube) return null;
    const rect = pCanvas.getBoundingClientRect();
    const touch = e.touches && e.touches.length > 0 ? e.touches.item(0) : e;
    const x = Math.floor(((touch.clientX - rect.left) / rect.width) * cube.res);
    const y = Math.floor(((touch.clientY - rect.top) / rect.height) * cube.res);
    if (x < 0 || x >= cube.res || y < 0 || y >= cube.res) return null;
    return { x: x, y: y };
  }

  function plotBrush(grid, res, cx, cy, val) {
    const bSize = parseInt(document.getElementById('brush-size').value) || 1;
    const offset = Math.floor(bSize / 2);
    for (let dy = 0; dy < bSize; dy++) {
      for (let dx = 0; dx < bSize; dx++) {
        const px = cx - offset + dx;
        const py = cy - offset + dy;
        if (px >= 0 && px < res && py >= 0 && py < res) {
          grid.splice(py * res + px, 1, val);
        }
      }
    }
  }

  function floodFill(grid, res, sx, sy, fillCol) {
    const targetCol = grid.at(sy * res + sx);
    if (targetCol === fillCol) return;
    const stack = new Array({ x: sx, y: sy });
    while (stack.length > 0) {
      const pt = stack.pop();
      const idx = pt.y * res + pt.x;
      if (grid.at(idx) !== targetCol) continue;
      grid.splice(idx, 1, fillCol);
      if (pt.x > 0) stack.push({ x: pt.x - 1, y: pt.y });
      if (pt.x < res - 1) stack.push({ x: pt.x + 1, y: pt.y });
      if (pt.y > 0) stack.push({ x: pt.x, y: pt.y - 1 });
      if (pt.y < res - 1) stack.push({ x: pt.x, y: pt.y + 1 });
    }
  }

  function drawLineCells(grid, res, x0, y0, x1, y1, val) {
    let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    let sx = (x0 < x1) ? 1 : -1, sy = (y0 < y1) ? 1 : -1;
    let err = dx - dy;
    while (true) {
      plotBrush(grid, res, x0, y0, val);
      if (x0 === x1 && y0 === y1) break;
      let e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
  }

  function drawCircleCells(grid, res, x0, y0, x1, y1, val) {
    const r = Math.round(Math.hypot(x1 - x0, y1 - y0));
    for (let y = 0; y < res; y++) {
      for (let x = 0; x < res; x++) {
        const d = Math.round(Math.hypot(x - x0, y - y0));
        if (d === r) plotBrush(grid, res, x, y, val);
      }
    }
  }

  function pickColorAtCell(cube, cell) {
    const picked = cube.textures.at(selectedFace).at(cell.y * cube.res + cell.x);
    document.getElementById('brush-color').value = picked || cube.color;
  }
  pCanvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const cube = cubes.find(c => c.id === selectedId);
    const cell = getCellFromTouch(e);
    if (!cube || !cell) return;

    isPainting = true;
    startCell = cell;
    currentCell = cell;
    isLongPressEyedrop = false;
    clearTimeout(longPressTimer);

    const grid = cube.textures.at(selectedFace);
    previewBackup = grid.slice();

    if (paintTool === 'eyedrop') {
      renderPaintCanvas();
      return;
    }

    // 動かずに450ms長押ししたらスポイト発動（1マスでも動いたらキャンセル）
    if (paintTool === 'pen') {
      longPressTimer = setTimeout(() => {
        if (isPainting && startCell && currentCell && startCell.x === currentCell.x && startCell.y === currentCell.y) {
          isLongPressEyedrop = true;
          grid.splice(0, grid.length, ...previewBackup);
          renderPaintCanvas();
        }
      }, 450);
    }

    const col = document.getElementById('brush-color').value;
    if (paintTool === 'pen') {
      plotBrush(grid, cube.res, cell.x, cell.y, col);
    } else if (paintTool === 'eraser') {
      plotBrush(grid, cube.res, cell.x, cell.y, null);
    } else if (paintTool === 'fill') {
      floodFill(grid, cube.res, cell.x, cell.y, col);
    }
    renderPaintCanvas();
  }, { passive: false });

  pCanvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!isPainting) return;
    const cube = cubes.find(c => c.id === selectedId);
    const cell = getCellFromTouch(e);
    if (!cube || !cell) return;

    // 1マスでも動いたら長押しスポイト予約を即キャンセル
    if (!currentCell || cell.x !== currentCell.x || cell.y !== currentCell.y) {
      clearTimeout(longPressTimer);
      currentCell = cell;
    }

    if (paintTool === 'eyedrop' || isLongPressEyedrop) {
      renderPaintCanvas();
      return;
    }

    const grid = cube.textures.at(selectedFace);
    const col = document.getElementById('brush-color').value;

    if (paintTool === 'pen') {
      plotBrush(grid, cube.res, cell.x, cell.y, col);
    } else if (paintTool === 'eraser') {
      plotBrush(grid, cube.res, cell.x, cell.y, null);
    } else if (paintTool === 'line') {
      grid.splice(0, grid.length, ...previewBackup);
      drawLineCells(grid, cube.res, startCell.x, startCell.y, cell.x, cell.y, col);
    } else if (paintTool === 'circle') {
      grid.splice(0, grid.length, ...previewBackup);
      drawCircleCells(grid, cube.res, startCell.x, startCell.y, cell.x, cell.y, col);
    }
    renderPaintCanvas();
  }, { passive: false });

  pCanvas.addEventListener('touchend', () => {
    clearTimeout(longPressTimer);
    const cube = cubes.find(c => c.id === selectedId);
    if (isPainting && cube && currentCell) {
      if (paintTool === 'eyedrop' || isLongPressEyedrop) {
        pickColorAtCell(cube, currentCell);
        setPaintTool('pen');
      }
    }
    isPainting = false;
    isLongPressEyedrop = false;
    startCell = null;
    currentCell = null;
    renderPaintCanvas();
  });

  function renderPaintCanvas() {
    pCtx.clearRect(0, 0, 224, 224);
    const cube = cubes.find(c => c.id === selectedId);
    if (!cube) return;
    const res = cube.res;
    const grid = cube.textures.at(selectedFace);
    const cellSize = 224 / res;

    for (let y = 0; y < res; y++) {
      for (let x = 0; x < res; x++) {
        const col = grid.at(y * res + x);
        if (col) {
          pCtx.fillStyle = col;
          pCtx.fillRect(x * cellSize, y * cellSize, Math.ceil(cellSize), Math.ceil(cellSize));
        }
        if (res <= 32) {
          pCtx.strokeStyle = 'rgba(255,255,255,0.12)';
          pCtx.lineWidth = 0.5;
          pCtx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
        }
      }
    }

    if (isPainting && currentCell && (paintTool === 'eyedrop' || isLongPressEyedrop)) {
      pCtx.strokeStyle = '#ffff00';
      pCtx.lineWidth = 2;
      pCtx.strokeRect(currentCell.x * cellSize, currentCell.y * cellSize, cellSize, cellSize);
    }
  }
  // --- 3D描画ループ（ボーン支点マーカー・高精細テクスチャ対応） ---
  function drawScene() {
    if (canvas.width !== viewport.clientWidth || canvas.height !== viewport.clientHeight) {
      canvas.width = viewport.clientWidth;
      canvas.height = viewport.clientHeight;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. グリッド床
    ctx.lineWidth = 1;
    for (let i = -16; i <= 16; i += 4) {
      ctx.strokeStyle = (i === 0) ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.12)';
      let p1 = project(i, 0, -16);
      let p2 = project(i, 0, 16);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();

      let p3 = project(-16, 0, i);
      let p4 = project(16, 0, i);
      ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
    }

    // 2. 座標軸 (X:赤, Y:緑, Z:青)
    const o = project(0, 0, 0);
    const axX = project(12, 0, 0);
    const axY = project(0, 12, 0);
    const axZ = project(0, 0, 12);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#e06c75'; ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(axX.x, axX.y); ctx.stroke();
    ctx.strokeStyle = '#98c379'; ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(axY.x, axY.y); ctx.stroke();
    ctx.strokeStyle = '#61afef'; ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(axZ.x, axZ.y); ctx.stroke();

    // 3. 全キューブの面を収集
    let allFaces = new Array();

    cubes.forEach(c => {
      const hx = c.size.x / 2, hy = c.size.y / 2, hz = c.size.z / 2;
      const cx = c.pos.x + hx;
      const cy = c.pos.y + hy;
      const cz = c.pos.z + hz;

      const rawVerts = new Array(
        { x: -hx, y: -hy, z: -hz },
        { x:  hx, y: -hy, z: -hz },
        { x:  hx, y:  hy, z: -hz },
        { x: -hx, y:  hy, z: -hz },
        { x: -hx, y: -hy, z:  hz },
        { x:  hx, y: -hy, z:  hz },
        { x:  hx, y:  hy, z:  hz },
        { x: -hx, y:  hy, z:  hz }
      );

      const verts = rawVerts.map(v => {
        const r = rotatePoint(v.x, v.y, v.z, c.rot.x, c.rot.y, c.rot.z);
        return project(cx + r.x, cy + r.y, cz + r.z);
      });

      const faceDefs = new Array(
        { fIdx: 0, idx: new Array(0, 1, 2, 3), light: 0.85 },
        { fIdx: 1, idx: new Array(5, 4, 7, 6), light: 0.95 },
        { fIdx: 2, idx: new Array(4, 0, 3, 7), light: 0.75 },
        { fIdx: 3, idx: new Array(1, 5, 6, 2), light: 0.80 },
        { fIdx: 4, idx: new Array(3, 2, 6, 7), light: 1.15 },
        { fIdx: 5, idx: new Array(4, 5, 1, 0), light: 0.55 }
      );

      faceDefs.forEach(f => {
        const p0 = verts.at(f.idx.at(0));
        const p1 = verts.at(f.idx.at(1));
        const p2 = verts.at(f.idx.at(2));
        const p3 = verts.at(f.idx.at(3));
        const avgZ = (p0.z + p1.z + p2.z + p3.z) / 4;

        allFaces.push({
          pts: new Array(p0, p1, p2, p3),
          z: avgZ,
          cube: c,
          faceIdx: f.fIdx,
          light: f.light,
          selected: (c.id === selectedId)
        });
      });
    });

    allFaces.sort((a, b) => b.z - a.z);

    allFaces.forEach(f => {
      const p0 = f.pts.at(0), p1 = f.pts.at(1), p2 = f.pts.at(2), p3 = f.pts.at(3);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();

      ctx.fillStyle = shadeColor(f.cube.color, f.light);
      ctx.fill();

      // ペイントされたドット絵を3D面に投影描画
      const res = f.cube.res;
      const grid = f.cube.textures.at(f.faceIdx);
      const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

      for (let py = 0; py < res; py++) {
        const v0 = py / res, v1 = (py + 1) / res;
        const top0 = lerp(p0, p3, v0), top1 = lerp(p1, p2, v0);
        const bot0 = lerp(p0, p3, v1), bot1 = lerp(p1, p2, v1);

        for (let px = 0; px < res; px++) {
          const col = grid.at(py * res + px);
          if (!col) continue;
          const u0 = px / res, u1 = (px + 1) / res;

          const c00 = lerp(top0, top1, u0), c10 = lerp(top0, top1, u1);
          const c11 = lerp(bot0, bot1, u1), c01 = lerp(bot0, bot1, u0);

          ctx.beginPath();
          ctx.moveTo(c00.x, c00.y);
          ctx.lineTo(c10.x, c10.y);
          ctx.lineTo(c11.x, c11.y);
          ctx.lineTo(c01.x, c01.y);
          ctx.closePath();
          ctx.fillStyle = shadeColor(col, f.light);
          ctx.fill();
        }
      }

      ctx.lineWidth = f.selected ? 1.5 : 0.8;
      ctx.strokeStyle = f.selected ? '#ffeb3b' : 'rgba(255,255,255,0.35)';
      ctx.stroke();
    });

    // 4. 選択中ボーンのピボット（支点）マーカー表示（ピンク十字＋円）
    const activeBone = bones.find(b => b.id === selectedBoneId);
    if (activeBone) {
      const bp = project(activeBone.pivot.x, activeBone.pivot.y, activeBone.pivot.z);
      ctx.strokeStyle = '#ff4081';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bp.x, bp.y, 6, 0, Math.PI * 2);
      ctx.moveTo(bp.x - 10, bp.y); ctx.lineTo(bp.x + 10, bp.y);
      ctx.moveTo(bp.x, bp.y - 10); ctx.lineTo(bp.x, bp.y + 10);
      ctx.stroke();
    }

    requestAnimationFrame(drawScene);
  }

  // --- テクスチャPNG書き出し ---
  function exportTexturePNG() {
    const texCanvas = document.createElement('canvas');
    const maxRes = cubes.reduce((m, c) => Math.max(m, c.res), 16);
    texCanvas.width = maxRes * 6;
    texCanvas.height = maxRes * Math.max(1, cubes.length);
    const tCtx = texCanvas.getContext('2d');

    cubes.forEach((c, cIdx) => {
      const offsetY = cIdx * maxRes;
      const scale = maxRes / c.res;
      for (let f = 0; f < 6; f++) {
        const offsetX = f * maxRes;
        const grid = c.textures.at(f);
        for (let y = 0; y < c.res; y++) {
          for (let x = 0; x < c.res; x++) {
            const col = grid.at(y * c.res + x) || c.color;
            tCtx.fillStyle = col;
            tCtx.fillRect(offsetX + x * scale, offsetY + y * scale, scale, scale);
          }
        }
      }
    });

    texCanvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'custom_texture.png';
      a.click();
      URL.revokeObjectURL(url);
    });
  }

  // --- Minecraft BE geometry.json エクスポート（複数ボーン対応） ---
  function exportBedrockJSON() {
    const identifier = document.getElementById('model-id').value.trim() || 'geometry.custom_model';
    const maxRes = cubes.reduce((m, c) => Math.max(m, c.res), 16);
    const texW = maxRes * 6;
    const texH = maxRes * Math.max(1, cubes.length);

    const bedrockBones = bones.map(b => {
      const boneCubes = new Array();
      cubes.forEach((c, cIdx) => {
        if (c.boneId !== b.id) return;
        const uvY = cIdx * maxRes;
        const cubeObj = {
          origin: new Array(-(c.pos.x + c.size.x), c.pos.y, c.pos.z),
          size: new Array(c.size.x, c.size.y, c.size.z),
          uv: new Array(0, uvY)
        };
        if (c.rot.x !== 0 || c.rot.y !== 0 || c.rot.z !== 0) {
          cubeObj.rotation = new Array(c.rot.x, -c.rot.y, -c.rot.z);
          cubeObj.pivot = new Array(
            -(c.pos.x + c.size.x / 2),
            c.pos.y + c.size.y / 2,
            c.pos.z + c.size.z / 2
          );
        }
        boneCubes.push(cubeObj);
      });

      const boneObj = {
        name: b.name,
        pivot: new Array(-b.pivot.x, b.pivot.y, b.pivot.z),
        cubes: boneCubes
      };
      if (b.parentId) {
        const pBone = bones.find(x => x.id === b.parentId);
        if (pBone) boneObj.parent = pBone.name;
      }
      return boneObj;

    });

    const jsonOutput = {
      format_version: "1.12.0",
      "minecraft:geometry": new Array({
        description: {
          identifier: identifier,
          texture_width: texW,
          texture_height: texH,
          visible_bounds_width: 2,
          visible_bounds_height: 2,
          visible_bounds_offset: new Array(0, 1, 0)
        },
        bones: bedrockBones
      })
    };

    const jsonStr = JSON.stringify(jsonOutput, null, 2);
    const blob = new Blob(new Array(jsonStr), { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${identifier.replace('geometry.', '')}.geo.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  // --- 4Dスキン用プレイヤー基本ボーン＆素体テンプレート ---
  function loadPlayerTemplate() {
    if (cubes.length > 0 && !confirm('現在のモデルを消去して、4Dスキン用のプレイヤー基本ボーン＆素体を読み込みますか？')) {

    }

    bones = new Array();

    const bRoot = addBone('root');

    bHead.parentId = bBody.id;

    const bRightArm = addBone('rightArm');

    const bRightItem = addBone('rightItem');
    bRightItem.parentId = bRightArm.id;
    bRightItem.pivot = { x: -6, y: 15, z: 1 };

    const bLeftArm = addBone('leftArm');

    bLeftArm.pivot = { x: 5, y: 22, z: 0 };

    bLeftItem.parentId = bLeftArm.id;
    bLeftItem.pivot = { x: 6, y: 15, z: 1 };

    // 2. 標準スティーブ体型の仮キューブを各ボーンに配置（不要なら削除・改造OK）
    const presetParts = new Array(
      { bone: bHead,     name: 'head_base',     size: { x: 8, y: 8, z: 8 },   pos: { x: -4, y: 24, z: -4 }, color: '#ffcc99' },
      { bone: bBody,     name: 'body_base',     size: { x: 8, y: 12, z: 4 },  pos: { x: -4, y: 12, z: -2 }, color: '#00aaaa' },
      { bone: bRightArm, name: 'rightArm_base', size: { x: 4, y: 12, z: 4 },  pos: { x: -8, y: 12, z: -2 }, color: '#ffcc99' },
      { bone: bLeftArm,  name: 'leftArm_base',  size: { x: 4, y: 12, z: 4 },  pos: { x: 4,  y: 12, z: -2 }, color: '#ffcc99' },
      { bone: bRightLeg, name: 'rightLeg_base', size: { x: 4, y: 12, z: 4 },  pos: { x: -4, y: 0,  z: -2 }, color: '#3344aa' },
      { bone: bLeftLeg,  name: 'leftLeg_base',  size: { x: 4, y: 12, z: 4 },  pos: { x: 0,  y: 0,  z: -2 }, color: '#3344aa' }
    );

    presetParts.forEach(p => {
      const id = 'cube_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      cubes.push({
        id: id,
        boneId: p.bone.id,
        name: p.name,
        size: p.size,
        pos: p.pos,
        rot: { x: 0, y: 0, z: 0 },
        color: p.color,
        res: texRes,
        textures: createEmptyTextures(texRes)
      });
    });

    selectCube(cubes.at(0).id);
    renderOutliner();
    updateUIInputs();
  }

  // --- 作業データ保存・読み込み・自動バックアップ ---
  const AUTOSAVE_KEY = 'pocketbench_autosave_v1';

  function buildProjectData() {
    return {
      version: 1,
      modelId: document.getElementById('model-id').value.trim() || 'geometry.custom_model',
      bones: bones,
      cubes: cubes,
      boneCounter: boneCounter,
      cubeCounter: cubeCounter
    };
  }

  function applyProjectData(data) {
    if (!data || !Array.isArray(data.bones) || !Array.isArray(data.cubes)) {
      alert('無効なプロジェクトファイルです');
      return;
    }
    bones = data.bones;
    cubes = data.cubes;
    boneCounter = data.boneCounter || (bones.length + 1);
    cubeCounter = data.cubeCounter || (cubes.length + 1);
    if (data.modelId) document.getElementById('model-id').value = data.modelId;

    selectedBoneId = bones.length > 0 ? bones.at(0).id : null;
    selectedId = cubes.length > 0 ? cubes.at(0).id : null;
    if (selectedId) {
      const c = cubes.find(x => x.id === selectedId);
      if (c) texRes = c.res || 16;
    }
    renderOutliner();
    updateUIInputs();
    renderPaintCanvas();
  }

  function saveProjectFile() {
    const data = buildProjectData();
    const jsonStr = JSON.stringify(data);
    const blob = new Blob(new Array(jsonStr), { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fileName = (data.modelId.replace('geometry.', '') || 'model') + '.pbench';
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
  }

  function loadProjectFile(input) {
    const file = input.files.item(0);
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        applyProjectData(parsed);
        triggerAutoSave();
        alert('プロジェクトを読み込みました！');
      } catch (err) {
        alert('ファイルの読み込みに失敗しました: ' + err.message);
      }
    };
    reader.readAsText(file);
    input.value = '';
  }

  function triggerAutoSave() {
    try {
      const jsonStr = JSON.stringify(buildProjectData());
      localStorage.setItem(AUTOSAVE_KEY, jsonStr);
      const st = document.getElementById('autosave-status');
      if (st) {
        const now = new Date();
        st.textContent = `自動バックアップ済 (${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')})`;
      }
    } catch (e) {
      // プレビュー環境でストレージ制限がある場合はスキップ
    }
  }

  function resetAutoSave() {
    if (!confirm('自動保存データを消去して初期状態に戻しますか？')) return;
    try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) {}
    bones = new Array();
    cubes = new Array();
    boneCounter = 1;
    cubeCounter = 1;
    addBone('body');
    addCube();
  }

  // --- Web内 最大10個スロット保存機能 ---
  const SLOTS_KEY = 'pocketbench_slots_v1';
  const MAX_SLOTS = 10;

  function getWebSlots() {
    try {
      const raw = localStorage.getItem(SLOTS_KEY);
      const arr = raw ? JSON.parse(raw) : new Array();
      return Array.isArray(arr) ? arr : new Array();
    } catch (e) {
      return new Array();
    }
  }

  function setWebSlots(arr) {
    try {
      localStorage.setItem(SLOTS_KEY, JSON.stringify(arr));
      return true;
    } catch (e) {
      alert('保存容量の上限に達しました。不要なデータを削除するか、.pbenchファイルで保存してください。');
      return false;
    }
  }

  function saveToWebSlot() {
    const slots = getWebSlots();
    if (slots.length >= MAX_SLOTS) {
      alert('Web内保存は最大10個までです。どれかを上書きするか削除してください。');
      return;
    }
    const nameInput = document.getElementById('slot-save-name');
    const title = nameInput.value.trim() || (document.getElementById('model-id').value.replace('geometry.', '') || '無題のモデル');
    const now = new Date();
    const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

    slots.unshift({
      id: 'slot_' + Date.now(),
      title: title,
      date: dateStr,
      data: buildProjectData()
    });

    if (setWebSlots(slots)) {
      nameInput.value = '';
      renderWebSlots();
    }
  }

  function overwriteWebSlot(slotId) {
    const slots = getWebSlots();
    const target = slots.find(s => s.id === slotId);
    if (!target) return;
    if (!confirm(`「${target.title}」に現在の作業内容を上書きしますか？`)) return;

    const now = new Date();
    target.date = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
    target.data = buildProjectData();

    if (setWebSlots(slots)) {
      renderWebSlots();
    }
  }

  function loadFromWebSlot(slotId) {
    const slots = getWebSlots();
    const target = slots.find(s => s.id === slotId);
    if (!target) return;
    if (!confirm(`「${target.title}」を読み込みますか？（現在の未保存の作業は上書きされます）`)) return;

    applyProjectData(target.data);
    triggerAutoSave();
  }

  function deleteWebSlot(slotId) {
    const slots = getWebSlots();
    const idx = slots.findIndex(s => s.id === slotId);
    if (idx === -1) return;
    if (!confirm(`「${slots.at(idx).title}」を削除しますか？`)) return;

    slots.splice(idx, 1);
    setWebSlots(slots);
    renderWebSlots();
  }

  function renderWebSlots() {
    const list = document.getElementById('web-slot-list');
    if (!list) return;
    const slots = getWebSlots();

    if (slots.length === 0) {
      list.innerHTML = '<div style="font-size:11px; color:#777; text-align:center; padding:8px; background:var(--bg-panel); border-radius:6px;">保存されたデータはありません（0 / 10）</div>';
      return;
    }

    list.innerHTML = `<div style="font-size:11px; color:#aaa; margin-bottom:4px;">保存済み: ${slots.length} / 10 個</div>`;
    slots.forEach(s => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; background:var(--bg-panel); border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin-bottom:4px;';
      row.innerHTML = `
        <div style="overflow:hidden; max-width:48%;">
          <div style="font-size:12px; font-weight:bold; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${s.title}</div>
          <div style="font-size:10px; color:#888;">${s.date}</div>
        </div>
        <div style="display:flex; gap:3px;">
          <button class="btn btn-small" onclick="loadFromWebSlot('${s.id}')">読込</button>
          <button class="btn btn-dark btn-small" onclick="overwriteWebSlot('${s.id}')">上書</button>
          <button class="btn btn-danger btn-small" onclick="deleteWebSlot('${s.id}')">消</button>
        </div>
      `;
      list.appendChild(row);
    });
  }

  // 起動時にリストを描画
  renderWebSlots();

  // 起動（自動保存データがあれば復元、なければ初期モデル生成）
  let restored = false;
  try {
    const saved = localStorage.getItem(AUTOSAVE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && Array.isArray(parsed.bones) && parsed.bones.length > 0) {
        applyProjectData(parsed);
        restored = true;
      }
    }
  } catch (e) {}

  if (!restored) {
    addBone('body');
    addCube();
  }
  drawScene();
</script>
</body>
</html>
